{% extends "base.html" %}
{% block title %}Change password · MTD records{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 40px auto;">
  <h1>Change your password</h1>
  <p class="muted">Signed in as {{ user.email }}.</p>
  <form method="post" action="/account/password">
    <p><label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required autofocus></p>
    <p><label for="password">New password (10+ characters)</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required></p>
    <p><label for="repeat">Repeat new password</label><input id="repeat" name="repeat" type="password" minlength="10" autocomplete="new-password" required></p>
    <button type="submit">Change password</button>
  </form>
</div>
{% endblock %}
