{% extends "base.html" %}
{% block title %}Sign in · MTD records{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 40px auto;">
  <h1>Sign in</h1>
  <form method="post" action="/login">
    <p><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></p>
    <p><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></p>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
